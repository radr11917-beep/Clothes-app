<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOUTH STYLE - سجل وتتبع المخزون</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #0d233a;
      --accent: #f5b027;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text-dark); padding-bottom: 40px; }
    
    header { background: var(--primary); color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .brand-info { display: flex; align-items: center; gap: 10px; }
    .logo-circle { width: 44px; height: 44px; border: 2px solid var(--accent); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.55rem; font-weight: bold; }
    .brand-text h1 { font-size: 1.25rem; font-weight: 800; line-height: 1.1; }
    .brand-text p { font-size: 0.7rem; color: #94a3b8; }
    
    .btn-add { background: var(--accent); color: var(--primary); border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    
    .container { max-width: 600px; margin: 0 auto; padding: 1rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.2rem; }
    .stat-card { background: var(--card-bg); border-radius: 12px; padding: 12px 6px; text-align: center; border: 1px solid #e2e8f0; }
    .stat-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin: 0 auto 6px auto; font-size: 0.9rem; }
    .icon-box { background: #e0e7ff; color: #3730a3; }
    .icon-check { background: #dcfce7; color: #166534; }
    .icon-wallet { background: #fef3c7; color: #92400e; }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; }
    .stat-value { font-size: 1.1rem; font-weight: bold; color: var(--primary); }
    
    .search-box { width: 100%; padding: 12px 15px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.9rem; margin-bottom: 12px; outline: none; }
    .filters { display: flex; gap: 8px; margin-bottom: 1.5rem; overflow-x: auto; padding-bottom: 4px; }
    .filter-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid #e2e8f0; background: white; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
    .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    .products-grid { display: grid; gap: 12px; }
    .product-card { background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; display: flex; gap: 12px; align-items: center; }
    .product-img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: #f1f5f9; }
    .product-details { flex: 1; text-align: right; }
    .product-title { font-weight: bold; font-size: 0.95rem; }
    .product-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .product-price { font-weight: bold; color: var(--success); margin-top: 4px; }
    .badge-out { color: var(--danger); font-weight: bold; background: #fee2e2; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
    
    .action-btns { display: flex; gap: 6px; flex-direction: column; align-items: center; }
    .action-row { display: flex; gap: 6px; }
    .btn-action { padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; border: 1px solid; }
    .btn-sell { background: #d1fae5; color: #065f46; border-color: #a7f3d0; }
    .btn-add-qty { background: #e0f2fe; color: #0369a1; border-color: #bae6fd; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px 10px; }
    .modal-content { background: white; padding: 1.5rem; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    .modal-header { font-size: 1.1rem; font-weight: bold; margin-bottom: 1.2rem; color: var(--primary); }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; }
    .form-control { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; }
    .file-input-wrapper { position: relative; width: 100%; }
    .file-input-label { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border: 2px dashed var(--border); border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .file-input { display: none; }
    .image-preview { margin-top: 8px; max-height: 100px; border-radius: 6px; display: none; object-fit: cover; }
    
    .modal-actions { display: flex; gap: 10px; margin-top: 1.5rem; }
    .btn-save { flex: 1; background: var(--accent); color: var(--primary); border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-save:disabled { background: #cbd5e1; cursor: not-allowed; }
    .btn-danger { flex: 1; background: var(--danger); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-cancel { flex: 1; background: #ffffff; border: 1px solid var(--border); padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="brand-info">
      <div class="logo-circle"><span>YOUTH</span><span>STYLE</span></div>
      <div class="brand-text"><h1>YOUTH STYLE</h1><p>سجل وتتبع المخزون</p></div>
    </div>
    <button class="btn-add" onclick="openModal()"><i class="fas fa-plus"></i> إضافة قطعة</button>
  </header>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon icon-box"><i class="fas fa-box"></i></div><div class="stat-label">إجمالي القطع</div><div class="stat-value" id="totalCount">0</div></div>
      <div class="stat-card"><div class="stat-icon icon-check"><i class="fas fa-check-circle"></i></div><div class="stat-label">متوفرة</div><div class="stat-value" id="availableCount">0</div></div>
      <div class="stat-card"><div class="stat-icon icon-wallet"><i class="fas fa-wallet"></i></div><div class="stat-label">قيمة المتوفر</div><div class="stat-value" id="totalValue">0</div></div>
    </div>
    <input type="text" class="search-box" id="searchInput" placeholder="ابحث عن نوع أو وصف..." oninput="renderData()">
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('الكل', this)">الكل</button>
      <button class="filter-btn" onclick="setFilter('متوفر', this)">متوفر</button>
      <button class="filter-btn" onclick="setFilter('منتهي', this)">منتهي</button>
    </div>
    <div id="productsGrid" class="products-grid"></div>
  </div>

  <div class="modal" id="itemModal">
    <div class="modal-content">
      <div class="modal-header">إضافة قطعة جديدة</div>
      <form onsubmit="handleSave(event)">
        <div class="form-group"><label>الوصف / اسم القطعة</label><input type="text" id="pDesc" class="form-control" required></div>
        <div class="form-group"><label>النوع</label><input type="text" id="pType" class="form-control" required></div>
        <div class="form-group"><label>الكمية الأولية</label><input type="number" id="pQty" class="form-control" value="1" min="1" required></div>
        <div class="form-group"><label>السعر للقطعة (د.ج)</label><input type="number" id="pPrice" class="form-control" required></div>
        <div class="form-group">
          <label>صورة القطعة</label>
          <div class="file-input-wrapper">
            <label for="pImgFile" class="file-input-label" id="fileLabel"><i class="fas fa-camera"></i> اختار صورة من الجهاز</label>
            <input type="file" id="pImgFile" class="file-input" accept="image/*" onchange="previewAndCompressImage(event)">
          </div>
          <img id="imgPreview" class="image-preview">
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn-save" id="btnSave">حفظ</button>
          <button type="button" onclick="closeModal()" class="btn-cancel">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal" id="deleteModal">
    <div class="modal-content" style="text-align: center;">
      <i class="fas fa-exclamation-triangle" style="font-size: 2.5rem; color: var(--danger); margin-bottom: 1rem;"></i>
      <div class="modal-header" style="text-align: center;">تأكيد الحذف</div>
      <p style="margin-bottom: 1.5rem;">هل أنت متأكد من الحذف؟</p>
      <div class="modal-actions">
        <button type="button" class="btn-danger" id="confirmDeleteBtn">حذف</button>
        <button type="button" class="btn-cancel" onclick="closeDeleteModal()">إلغاء</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxCUZ554jdDCdfQlVNCZTQhEq8E_L6k7-XraZ5NfY1bzmS0RgtWKnG_hV6vUbhWa5b55Q/exec";
    let allItems = []; let currentFilter = 'الكل'; let base64Image = ""; let itemToDeleteId = null;

    async function fetchData() {
      try {
        const res = await fetch(API_URL + "?t=" + new Date().getTime());
        const data = await res.json();
        allItems = Array.isArray(data) ? data : [];
        renderData();
      } catch (e) { console.error("Error fetching data:", e); }
    }

    function renderData() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const filtered = allItems.filter(item => {
        const isOutOfStock = Number(item.qty || 0) <= 0 || item.status === 'منتهي';
        const itemStatus = isOutOfStock ? 'منتهي' : 'متوفر';
        return (currentFilter === 'الكل' || itemStatus === currentFilter) && 
               ((item.desc || '').toLowerCase().includes(search) || (item.type || '').toLowerCase().includes(search));
      });

      document.getElementById("totalCount").innerText = allItems.reduce((acc, i) => acc + Number(i.qty || 0), 0);
      const avail = allItems.filter(i => Number(i.qty || 0) > 0);
      document.getElementById("availableCount").innerText = avail.reduce((acc, i) => acc + Number(i.qty || 0), 0);
      document.getElementById("totalValue").innerText = avail.reduce((acc, i) => acc + (Number(i.price || 0) * Number(i.qty || 0)), 0);

      const container = document.getElementById("productsGrid");
      container.innerHTML = "";
      
      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:2rem;"><i class="fas fa-tag" style="font-size:3rem;color:#cbd5e1;"></i><br>لا يوجد قطع</div>`;
        return;
      }

      filtered.forEach(item => {
        const qty = Number(item.qty || 0);
        const isOutOfStock = qty <= 0;
        const div = document.createElement("div");
        div.className = "product-card";
        div.innerHTML = `
          <img src="${item.image || 'https://via.placeholder.com/60'}" class="product-img">
          <div class="product-details">
            <div class="product-title">${item.desc || ''}</div>
            <div class="product-sub">${item.type || ''} | ${isOutOfStock ? '<span class="badge-out">منتهي</span>' : `الكمية: <strong>${qty}</strong>`}</div>
            <div class="product-price">${item.price || 0} د.ج</div>
          </div>
          <div class="action-btns">
            <div class="action-row">
              <button onclick="addPiece('${item.id}')" class="btn-action btn-add-qty"><i class="fas fa-plus"></i></button>
              ${!isOutOfStock ? `<button onclick="sellPiece('${item.id}')" class="btn-action btn-sell"><i class="fas fa-minus"></i></button>` : ''}
            </div>
            <button onclick="promptDelete('${item.id}')" style="background:none; border:none; color:var(--danger); cursor:pointer;"><i class="fas fa-trash"></i> حذف</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderData();
    }

    function openModal() { document.getElementById("itemModal").style.display = "flex"; }
    function closeModal() { 
      document.getElementById("itemModal").style.display = "none";
      base64Image = ""; document.getElementById("pImgFile").value = ""; 
      document.getElementById("imgPreview").style.display = "none";
      document.getElementById("fileLabel").innerHTML = `<i class="fas fa-camera"></i> اختار صورة`;
      document.getElementById("btnSave").disabled = false; document.getElementById("btnSave").innerText = "حفظ";
    }

    function previewAndCompressImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const scaleSize = 150 / img.width;
            canvas.width = 150; canvas.height = img.height * scaleSize;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            base64Image = canvas.toDataURL('image/jpeg', 0.4);
            document.getElementById("imgPreview").src = base64Image;
            document.getElementById("imgPreview").style.display = "block";
            document.getElementById("fileLabel").innerHTML = `<i class="fas fa-check"></i> تم الاختيار`;
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    // هنا تم وضع الحل السحري mode: "no-cors"
    function sendDataToGoogle(payload) {
      return fetch(API_URL, {
        method: "POST",
        mode: "no-cors", 
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
    }

    async function handleSave(e) {
      e.preventDefault();
      document.getElementById("btnSave").disabled = true;
      document.getElementById("btnSave").innerText = "جاري الحفظ...";
      const qtyVal = Number(document.getElementById("pQty").value);
      const newItem = {
        id: Date.now().toString(), desc: document.getElementById("pDesc").value,
        type: document.getElementById("pType").value, price: document.getElementById("pPrice").value,
        qty: qtyVal, status: qtyVal > 0 ? "متوفر" : "منتهي", image: base64Image
      };
      
      allItems.unshift(newItem);
      renderData();
      closeModal();
      
      await sendDataToGoogle({ action: "save", item: newItem });
      setTimeout(fetchData, 1500); // تحديث القائمة بعد ثانية ونصف للتأكد من وصولها لجوجل
    }

    async function addPiece(id) {
      const item = allItems.find(i => i.id == id);
      if (item) {
        item.qty = Number(item.qty) + 1; item.status = "متوفر"; renderData();
        await sendDataToGoogle({ action: "save", item: item });
      }
    }

    async function sellPiece(id) {
      const item = allItems.find(i => i.id == id);
      if (item && Number(item.qty) > 0) {
        item.qty = Number(item.qty) - 1; if(item.qty === 0) item.status = "منتهي"; renderData();
        await sendDataToGoogle({ action: "save", item: item });
      }
    }

    function promptDelete(id) { itemToDeleteId = id; document.getElementById("deleteModal").style.display = "flex"; }
    function closeDeleteModal() { itemToDeleteId = null; document.getElementById("deleteModal").style.display = "none"; }

    document.getElementById("confirmDeleteBtn").onclick = async function() {
      if (!itemToDeleteId) return;
      const id = itemToDeleteId;
      closeDeleteModal();
      allItems = allItems.filter(i => i.id != id); renderData();
      await sendDataToGoogle({ action: "delete", id: id });
    };

    fetchData();
  </script>
</body>
</html>
