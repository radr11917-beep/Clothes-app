<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Youth Style - سجل الملابس</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // رابط شعار Youth Style
    const LOGO_URL = "https://i.ibb.co/L9C17yJ/youth-style-logo.png"; // يمكن استبداله برابط الشعار الخاص بك إن وجد

    if (!window.storage) {
      window.storage = {
        async list(prefix) {
          const keys = Object.keys(localStorage).filter(k => k.startsWith(prefix));
          return { keys };
        },
        async get(key) {
          return { value: localStorage.getItem(key) };
        },
        async set(key, value) {
          localStorage.setItem(key, value);
          return true;
        },
        async delete(key) {
          localStorage.removeItem(key);
          return true;
        }
      };
    }

    const emptySizeRow = () => ({ size: "", qty: 1 });
    const EMPTY_FORM = { type: "", desc: "", price: "", status: "available", image: null, sizes: [emptySizeRow()] };

    function ClothesInventory() {
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [form, setForm] = useState(EMPTY_FORM);
      const [editingId, setEditingId] = useState(null);
      const [query, setQuery] = useState("");
      const [filter, setFilter] = useState("all");
      const [showForm, setShowForm] = useState(false);
      const [err, setErr] = useState("");
      const [saving, setSaving] = useState(false);
      const fileRef = useRef(null);

      useEffect(() => {
        loadAll();
      }, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const loadAll = async () => {
        setLoading(true);
        try {
          const listRes = await window.storage.list("item:");
          const keys = (listRes && listRes.keys) || [];
          const loaded = [];
          for (const k of keys) {
            try {
              const res = await window.storage.get(k);
              if (res && res.value) loaded.push(JSON.parse(res.value));
            } catch (e) {}
          }
          loaded.sort((a, b) => Number(b.id) - Number(a.id));
          setItems(loaded);
        } catch (e) {
          setItems([]);
        } finally {
          setLoading(false);
        }
      };

      const totalQty = (it) => (it.sizes || []).reduce((s, r) => s + (Number(r.qty) || 0), 0);

      const saveItem = async (item) => {
        setSaving(true);
        try {
          const res = await window.storage.set("item:" + item.id, JSON.stringify(item));
          if (!res) throw new Error("save failed");
          setErr("");
          return true;
        } catch (e) {
          setErr("تعذر حفظ القطعة، تحقق من الاتصال وحاول مجددًا.");
          return false;
        } finally {
          setSaving(false);
        }
      };

      const resetForm = () => {
        setForm(EMPTY_FORM);
        setEditingId(null);
        setShowForm(false);
      };

      const handleImageFile = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxW = 500;
            const scale = Math.min(1, maxW / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.72);
            setForm((f) => ({ ...f, image: dataUrl }));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      };

      const updateSizeRow = (idx, field, value) => {
        setForm((f) => {
          const sizes = [...f.sizes];
          sizes[idx] = { ...sizes[idx], [field]: value };
          return { ...f, sizes };
        });
      };
      const addSizeRow = () => setForm((f) => ({ ...f, sizes: [...f.sizes, emptySizeRow()] }));
      const removeSizeRow = (idx) => setForm((f) => ({ ...f, sizes: f.sizes.filter((_, i) => i !== idx) }));

      const submit = async (e) => {
        e.preventDefault();
        if (!form.type.trim()) return;
        const cleanSizes = form.sizes.filter((r) => Number(r.qty) > 0).map((r) => ({ size: r.size.trim(), qty: Number(r.qty) }));
        const finalSizes = cleanSizes.length ? cleanSizes : [{ size: "", qty: 1 }];
        const id = editingId || Date.now().toString();
        const item = {
          id,
          type: form.type.trim(),
          desc: form.desc.trim(),
          price: Number(form.price) || 0,
          status: form.status,
          image: form.image,
          sizes: finalSizes,
        };
        const ok = await saveItem(item);
        if (ok) {
          setItems((prev) => {
            const exists = prev.some((p) => p.id === id);
            return exists ? prev.map((p) => (p.id === id ? item : p)) : [item, ...prev];
          });
          resetForm();
        }
      };

      const startEdit = (it) => {
        setForm({
          type: it.type,
          desc: it.desc,
          price: it.price,
          status: it.status,
          image: it.image || null,
          sizes: it.sizes && it.sizes.length ? it.sizes : [emptySizeRow()],
        });
        setEditingId(it.id);
        setShowForm(true);
      };

      const remove = async (id) => {
        try {
          await window.storage.delete("item:" + id);
          setItems((prev) => prev.filter((it) => it.id !== id));
        } catch (e) {
          setErr("تعذر حذف القطعة.");
        }
      };

      const toggleStatus = async (it) => {
        const updated = { ...it, status: it.status === "available" ? "sold" : "available" };
        const ok = await saveItem(updated);
        if (ok) setItems((prev) => prev.map((x) => (x.id === it.id ? updated : x)));
      };

      const filtered = useMemo(() => {
        return items.filter((it) => {
          const matchesQuery = (it.type + " " + it.desc).toLowerCase().includes(query.toLowerCase());
          const matchesFilter = filter === "all" || it.status === filter;
          return matchesQuery && matchesFilter;
        });
      }, [items, query, filter]);

      const stats = useMemo(() => {
        const totalPieces = items.reduce((s, it) => s + totalQty(it), 0);
        const availablePieces = items.filter((i) => i.status === "available").reduce((s, it) => s + totalQty(it), 0);
        const totalValue = items.filter((i) => i.status === "available").reduce((s, it) => s + totalQty(it) * Number(it.price || 0), 0);
        return { totalPieces, availablePieces, totalValue };
      }, [items]);

      return (
        <div dir="rtl" className="min-h-screen pb-10" style={{ background: "#F4F5F7", fontFamily: "'IBM Plex Sans Arabic', sans-serif" }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');
            .brand-font { font-family: 'Cairo', sans-serif; }
            .tag-card { position: relative; }
            .tag-card::before {
              content: "";
              position: absolute;
              top: 14px;
              left: 22px;
              width: 10px;
              height: 10px;
              border-radius: 50%;
              background: #F4F5F7;
              border: 2px solid #112A46;
              z-index: 2;
            }
            .input { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid #D0D7DE; font-size: 14px; outline: none; background: #FFFFFF; }
            .input:focus { border-color: #112A46; ring: 2px solid #EBAA2B; }
          `}</style>

          {/* Header Theme Youth Style */}
          <header className="px-5 pt-6 pb-6 shadow-md" style={{ background: "#112A46" }}>
            <div className="max-w-5xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3">
                {/* SVG Logo Graphic Youth Style */}
                <div className="w-12 h-12 rounded-full flex items-center justify-center shadow-lg overflow-hidden border-2 border-[#EBAA2B]" style={{ background: "#112A46" }}>
                  <svg viewBox="0 0 100 100" className="w-full h-full p-1">
                    <circle cx="50" cy="50" r="48" fill="#112A46" />
                    <text x="50%" y="45%" textAnchor="middle" fill="#FFFFFF" fontSize="22" fontWeight="900" fontFamily="sans-serif">YOUTH</text>
                    <text x="50%" y="68%" textAnchor="middle" fill="#EBAA2B" fontSize="20" fontWeight="900" fontFamily="sans-serif">STYLE</text>
                  </svg>
                </div>
                <div>
                  <h1 className="brand-font text-2xl font-black tracking-wide" style={{ color: "#FFFFFF" }}>YOUTH STYLE</h1>
                  <p className="text-xs font-medium" style={{ color: "#EBAA2B" }}>سجل وتتبع المخزون</p>
                </div>
              </div>
              <button
                onClick={() => { setShowForm(true); setForm(EMPTY_FORM); setEditingId(null); }}
                className="flex items-center gap-2 px-4 py-2.5 rounded-lg font-bold text-sm shadow-md transition active:scale-95"
                style={{ background: "#EBAA2B", color: "#112A46" }}
              >
                <i data-lucide="plus" className="w-4 h-4 stroke-[3]"></i> إضافة قطعة
              </button>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-5 py-6">
            <div className="grid grid-cols-3 gap-3 mb-6">
              <StatCard icon="package" label="إجمالي القطع" value={stats.totalPieces} color="#112A46" />
              <StatCard icon="check-circle-2" label="متوفرة" value={stats.availablePieces} color="#2E7D32" />
              <StatCard icon="wallet" label="قيمة المتوفر (د.ج)" value={stats.totalValue.toLocaleString("ar-DZ")} color="#EBAA2B" textColor="#112A46" />
            </div>

            {err && (
              <div className="mb-4 px-4 py-2 rounded-lg text-sm font-medium" style={{ background: "#FFEBEE", color: "#C62828" }}>{err}</div>
            )}

            <div className="flex flex-col sm:flex-row gap-3 mb-6">
              <div className="flex items-center gap-2 flex-1 px-3 py-2.5 rounded-lg bg-white border shadow-sm" style={{ borderColor: "#D0D7DE" }}>
                <i data-lucide="search" className="w-4 h-4 text-[#6E7781]"></i>
                <input
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                  placeholder="ابحث عن نوع أو وصف..."
                  className="flex-1 outline-none text-sm bg-transparent"
                  style={{ color: "#112A46" }}
                />
              </div>
              <div className="flex gap-2">
                {[
                  { key: "all", label: "الكل" },
                  { key: "available", label: "متوفر" },
                  { key: "sold", label: "مباع" },
                ].map((f) => (
                  <button
                    key={f.key}
                    onClick={() => setFilter(f.key)}
                    className="px-4 py-2 rounded-lg text-sm font-bold transition shadow-sm"
                    style={filter === f.key ? { background: "#112A46", color: "#FFFFFF" } : { background: "#FFFFFF", color: "#424242", border: "1px solid #D0D7DE" }}
                  >
                    {f.label}
                  </button>
                ))}
              </div>
            </div>

            {showForm && (
              <form onSubmit={submit} className="mb-6 p-5 rounded-xl bg-white border shadow-md" style={{ borderColor: "#D0D7DE" }}>
                <div className="flex items-center justify-between mb-4">
                  <h2 className="brand-font font-bold text-lg" style={{ color: "#112A46" }}>{editingId ? "تعديل القطعة" : "قطعة جديدة"}</h2>
                  <button type="button" onClick={resetForm}><i data-lucide="x" className="w-5 h-5 text-[#6E7781]"></i></button>
                </div>

                <div className="mb-4">
                  <span className="block text-xs font-semibold mb-1" style={{ color: "#424242" }}>صورة القطعة</span>
                  <div className="flex items-center gap-3">
                    <div
                      onClick={() => fileRef.current && fileRef.current.click()}
                      className="w-24 h-24 rounded-lg flex items-center justify-center cursor-pointer overflow-hidden shrink-0 shadow-inner"
                      style={{ background: "#F4F5F7", border: "2px dashed #D0D7DE" }}
                    >
                      {form.image ? (
                        <img src={form.image} alt="معاينة" className="w-full h-full object-cover" />
                      ) : (
                        <i data-lucide="image-plus" className="w-6 h-6 text-[#6E7781]"></i>
                      )}
                    </div>
                    <input
                      ref={fileRef}
                      type="file"
                      accept="image/*"
                      className="hidden"
                      onChange={(e) => handleImageFile(e.target.files[0])}
                    />
                    <div className="flex flex-col gap-1">
                      <button type="button" onClick={() => fileRef.current && fileRef.current.click()} className="text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm" style={{ background: "#F4F5F7", color: "#112A46", border: "1px solid #D0D7DE" }}>
                        {form.image ? "تغيير الصورة" : "اختيار صورة"}
                      </button>
                      {form.image && (
                        <button type="button" onClick={() => setForm((f) => ({ ...f, image: null }))} className="flex items-center gap-1 text-xs font-semibold mt-1" style={{ color: "#C62828" }}>
                          <i data-lucide="image-off" className="w-3.5 h-3.5"></i> إزالة الصورة
                        </button>
                      )}
                    </div>
                  </div>
                </div>

                <div className="grid sm:grid-cols-2 gap-3 mb-4">
                  <Field label="نوع الملابس *">
                    <input required value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })} placeholder="مثال: قميص، بنطال، هودي" className="input" />
                  </Field>
                  <Field label="الوصف">
                    <input value={form.desc} onChange={(e) => setForm({ ...form, desc: e.target.value })} placeholder="مثال: كحلي قطن Youth Style" className="input" />
                  </Field>
                  <Field label="السعر للقطعة (د.ج)">
                    <input type="number" min="0" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} className="input" />
                  </Field>
                  <Field label="الحالة">
                    <select value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })} className="input">
                      <option value="available">متوفر</option>
                      <option value="sold">مباع</option>
                    </select>
                  </Field>
                </div>

                <div className="mb-4">
                  <span className="block text-xs font-semibold mb-2" style={{ color: "#424242" }}>المقاسات والكميات</span>
                  <div className="flex flex-col gap-2">
                    {form.sizes.map((row, idx) => (
                      <div key={idx} className="flex items-center gap-2">
                        <input
                          value={row.size}
                          onChange={(e) => updateSizeRow(idx, "size", e.target.value)}
                          placeholder="المقاس (مثال: S, M, L, XL)"
                          className="input flex-1"
                        />
                        <input
                          type="number"
                          min="1"
                          value={row.qty}
                          onChange={(e) => updateSizeRow(idx, "qty", e.target.value)}
                          placeholder="الكمية"
                          className="input"
                          style={{ width: 90 }}
                        />
                        {form.sizes.length > 1 && (
                          <button type="button" onClick={() => removeSizeRow(idx)}>
                            <i data-lucide="trash-2" className="w-4 h-4 text-[#C62828]"></i>
                          </button>
                        )}
                      </div>
                    ))}
                  </div>
                  <button type="button" onClick={addSizeRow} className="mt-2 flex items-center gap-1 text-xs font-bold" style={{ color: "#112A46" }}>
                    <i data-lucide="plus" className="w-3.5 h-3.5"></i> إضافة مقاس آخر
                  </button>
                </div>

                <button type="submit" disabled={saving} className="w-full py-2.5 rounded-lg font-bold text-sm shadow-md transition disabled:opacity-60" style={{ background: "#112A46", color: "#EBAA2B" }}>
                  {saving ? "جارِ الحفظ..." : editingId ? "حفظ التعديلات" : "إضافة إلى المخزون"}
                </button>
              </form>
            )}

            {loading ? (
              <p className="text-center py-10 text-sm font-medium" style={{ color: "#6E7781" }}>جارِ التحميل...</p>
            ) : filtered.length === 0 ? (
              <div className="text-center py-16">
                <i data-lucide="tag" className="w-10 h-10 text-[#D0D7DE] mx-auto mb-3"></i>
                <p font-medium style={{ color: "#6E7781" }}>{items.length === 0 ? "لا توجد قطع بعد. أضف أول قطعة لمخزون Youth Style." : "لا توجد نتائج مطابقة."}</p>
              </div>
            ) : (
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                {filtered.map((it) => (
                  <div key={it.id} className="tag-card rounded-xl overflow-hidden bg-white border shadow-sm hover:shadow-md transition" style={{ borderColor: "#D0D7DE" }}>
                    {it.image && (
                      <div className="w-full h-40 overflow-hidden" style={{ background: "#F4F5F7" }}>
                        <img src={it.image} alt={it.type} className="w-full h-full object-cover" />
                      </div>
                    )}
                    <div className="p-4 pt-5">
                      <div className="flex items-start justify-between mb-2">
                        <div>
                          <h3 className="font-bold text-base" style={{ color: "#112A46" }}>{it.type}</h3>
                          {it.desc && <p className="text-xs font-medium mt-0.5" style={{ color: "#6E7781" }}>{it.desc}</p>}
                        </div>
                        <span
                          className="text-xs px-2.5 py-1 rounded-full font-bold shrink-0 shadow-xs"
                          style={it.status === "available" ? { background: "#E8F5E9", color: "#2E7D32" } : { background: "#FFEBEE", color: "#C62828" }}
                        >
                          {it.status === "available" ? "متوفر" : "مباع"}
                        </span>
                      </div>

                      <div className="flex flex-wrap gap-1.5 mb-3">
                        {(it.sizes || []).map((r, i) => (
                          <span key={i} className="text-xs px-2 py-1 rounded-md font-semibold" style={{ background: "#F4F5F7", color: "#112A46", border: "1px solid #E1E4E8" }}>
                            {r.size ? `${r.size}: ${r.qty}` : `الكمية: ${r.qty}`}
                          </span>
                        ))}
                      </div>

                      <div className="flex items-center gap-4 text-sm mb-3 font-medium" style={{ color: "#424242" }}>
                        <span>المجموع: <b>{totalQty(it)}</b></span>
                        {Number(it.price) > 0 && <span>السعر: <b style={{ color: "#112A46" }}>{Number(it.price).toLocaleString("ar-DZ")} د.ج</b></span>}
                      </div>

                      <div className="flex items-center gap-2 pt-3 border-t" style={{ borderColor: "#F0F0F0" }}>
                        <button onClick={() => toggleStatus(it)} className="flex items-center gap-1 text-xs font-bold px-2 py-1.5 rounded-lg" style={{ color: "#112A46", background: "#F4F5F7" }}>
                          <i data-lucide={it.status === "available" ? "x-circle" : "check-circle-2"} className="w-3.5 h-3.5"></i>
                          {it.status === "available" ? "وضع كمباع" : "إعادة كمتوفر"}
                        </button>
                        <button onClick={() => startEdit(it)} className="flex items-center gap-1 text-xs font-semibold px-2 py-1.5 rounded-lg mr-auto" style={{ color: "#6E7781" }}>
                          <i data-lucide="pencil" className="w-3.5 h-3.5"></i> تعديل
                        </button>
                        <button onClick={() => remove(it.id)} className="flex items-center gap-1 text-xs font-semibold px-2 py-1.5 rounded-lg" style={{ color: "#C62828" }}>
                          <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>
        </div>
      );
    }

    function StatCard({ icon, label, value, color, textColor }) {
      return (
        <div className="rounded-xl p-4 bg-white border shadow-sm" style={{ borderColor: "#D0D7DE" }}>
          <div className="w-8 h-8 rounded-lg flex items-center justify-center mb-2" style={{ background: color + "22", color }}>
            <i data-lucide={icon} className="w-4.5 h-4.5"></i>
          </div>
          <p className="text-xs font-semibold mb-1" style={{ color: "#6E7781" }}>{label}</p>
          <p className="brand-font text-xl font-black" style={{ color: textColor || "#112A46" }}>{value}</p>
        </div>
      );
    }

    function Field({ label, children }) {
      return (
        <label className="block">
          <span className="block text-xs font-semibold mb-1" style={{ color: "#424242" }}>{label}</span>
          {children}
        </label>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ClothesInventory />);
  </script>
</body>
</html>
