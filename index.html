<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سجل الملابس</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [items, setItems] = useState(() => {
        const saved = localStorage.getItem('clothes_items');
        return saved ? JSON.parse(saved) : [];
      });
      const [type, setType] = useState('');
      const [price, setPrice] = useState('');
      const [filter, setFilter] = useState('الكل');

      useEffect(() => {
        localStorage.setItem('clothes_items', JSON.stringify(items));
      }, [items]);

      const addItem = (e) => {
        e.preventDefault();
        if (!type || !price) return;
        setItems([...items, { id: Date.now(), type, price: Number(price), status: 'متوفر' }]);
        setType('');
        setPrice('');
      };

      const toggleStatus = (id) => {
        setItems(items.map(item => item.id === id ? { ...item, status: item.status === 'متوفر' ? 'تم البيع' : 'متوفر' } : item));
      };

      const deleteItem = (id) => {
        setItems(items.filter(item => item.id !== id));
      };

      const filtered = items.filter(item => filter === 'الكل' ? true : item.status === filter);
      const totalSales = items.filter(i => i.status === 'تم البيع').reduce((acc, curr) => acc + curr.price, 0);

      return (
        <div class="max-w-md mx-auto p-4 space-y-6">
          <header class="text-center py-4 bg-white rounded-xl shadow-sm border">
            <h1 class="text-2xl font-bold text-gray-800">سجل الملابس</h1>
            <p class="text-sm text-gray-500 mt-1">المبيعات: <span class="font-bold text-green-600">{totalSales} د.ج</span></p>
          </header>

          <form onSubmit={addItem} class="bg-white p-4 rounded-xl shadow-sm border space-y-3">
            <div>
              <input type="text" value={type} onChange={(e) => setType(e.target.value)} placeholder="نوع القطعة (قميص، سروال...)" class="w-full border p-2 rounded-lg text-sm" required />
            </div>
            <div>
              <input type="number" value={price} onChange={(e) => setPrice(e.target.value)} placeholder="السعر (د.ج)" class="w-full border p-2 rounded-lg text-sm" required />
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium text-sm hover:bg-blue-700">إضافة</button>
          </form>

          <div class="flex gap-2">
            {['الكل', 'متوفر', 'تم البيع'].map(st => (
              <button key={st} onClick={() => setFilter(st)} class={`flex-1 py-1.5 text-xs rounded-lg font-medium border ${filter === st ? 'bg-gray-800 text-white' : 'bg-white text-gray-600'}`}>
                {st}
              </button>
            ))}
          </div>

          <div class="space-y-2">
            {filtered.map(item => (
              <div key={item.id} class="bg-white p-3 rounded-lg border shadow-sm flex items-center justify-between">
                <div>
                  <h3 class="font-bold text-sm text-gray-800">{item.type}</h3>
                  <p class="text-xs text-gray-500">{item.price} د.ج</p>
                </div>
                <div class="flex items-center gap-2">
                  <button onClick={() => toggleStatus(item.id)} class={`px-2 py-1 rounded text-xs ${item.status === 'متوفر' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}`}>
                    {item.status}
                  </button>
                  <button onClick={() => deleteItem(item.id)} class="text-red-500 text-xs">حذف</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
