<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOUTH STYLE - سجل وتتبع المخزون</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #0d233a;
      --accent: #f5b027;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-dark);
      padding-bottom: 40px;
    }

    /* Header */
    header {
      background: var(--primary);
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-circle {
      width: 44px;
      height: 44px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.55rem;
      font-weight: bold;
      color: white;
      line-height: 1;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .brand-text p {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .btn-add {
      background: var(--accent);
      color: var(--primary);
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 1rem;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1.2rem;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 6px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }

    .stat-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 6px auto;
      font-size: 0.9rem;
    }

    .icon-box { background: #e0e7ff; color: #3730a3; }
    .icon-check { background: #dcfce7; color: #166534; }
    .icon-wallet { background: #fef3c7; color: #92400e; }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary);
    }

    /* Controls */
    .search-box {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.9rem;
      background: white;
      margin-bottom: 12px;
      outline: none;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    .filter-btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: white;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .products-grid {
      display: grid;
      gap: 12px;
    }

    .product-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .product-img {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      background: #f1f5f9;
    }

    .product-details { flex: 1; text-align: right; }
    .product-title { font-weight: bold; font-size: 0.95rem; }
    .product-sub { font-size: 0.8rem; color: var(--text-muted); }
    .product-price { font-weight: bold; color: var(--success); margin-top: 4px; }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px 10px;
    }

    .modal-content {
      background: white;
      padding: 1.5rem;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .modal-header {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 1.2rem;
      text-align: right;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 1rem;
      text-align: right;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .form-control {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      background-color: #f8fafc;
      outline: none;
    }

    .file-input-wrapper {
      position: relative;
      width: 100%;
    }

    .file-input-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background-color: #f8fafc;
      border: 2px dashed var(--border);
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .file-input { display: none; }

    .image-preview {
      margin-top: 8px;
      max-height: 100px;
      border-radius: 6px;
      display: none;
      object-fit: cover;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 1.5rem;
    }

    .btn-save {
      flex: 1;
      background: var(--accent);
      color: var(--primary);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-danger {
      flex: 1;
      background: var(--danger);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-cancel {
      flex: 1;
      background: #ffffff;
      color: var(--text-dark);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-info">
      <div class="logo-circle">
        <span>YOUTH</span>
        <span>STYLE</span>
      </div>
      <div class="brand-text">
        <h1>YOUTH STYLE</h1>
        <p>سجل وتتبع المخزون</p>
      </div>
    </div>
    <button class="btn-add" onclick="openModal()">
      <i class="fas fa-plus"></i> إضافة قطعة
    </button>
  </header>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon icon-box"><i class="fas fa-box"></i></div>
        <div class="stat-label">إجمالي القطع</div>
        <div class="stat-value" id="totalCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon icon-check"><i class="fas fa-check-circle"></i></div>
        <div class="stat-label">متوفرة</div>
        <div class="stat-value" id="availableCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon icon-wallet"><i class="fas fa-wallet"></i></div>
        <div class="stat-label">قيمة المتوفر (د.ج)</div>
        <div class="stat-value" id="totalValue">0</div>
      </div>
    </div>

    <input type="text" class="search-box" id="searchInput" placeholder="ابحث عن نوع أو وصف..." oninput="renderData()">

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('الكل', this)">الكل</button>
      <button class="filter-btn" onclick="setFilter('متوفر', this)">متوفر</button>
      <button class="filter-btn" onclick="setFilter('مباع', this)">مباع</button>
    </div>

    <div id="productsGrid" class="products-grid"></div>
  </div>

  <!-- Add Item Modal -->
  <div class="modal" id="itemModal">
    <div class="modal-content">
      <div class="modal-header">إضافة قطعة جديدة</div>
      <form onsubmit="handleSave(event)">
        <div class="form-group">
          <label>الوصف / اسم القطعة</label>
          <input type="text" id="pDesc" class="form-control" required>
        </div>
        <div class="form-group">
          <label>النوع</label>
          <input type="text" id="pType" class="form-control" placeholder="قميص، سروال..." required>
        </div>
        <div class="form-group">
          <label>السعر (د.ج)</label>
          <input type="number" id="pPrice" class="form-control" required>
        </div>
        <div class="form-group">
          <label>الحالة</label>
          <select id="pStatus" class="form-control">
            <option value="متوفر">متوفر</option>
            <option value="مباع">مباع</option>
          </select>
        </div>
        <div class="form-group">
          <label>صورة القطعة</label>
          <div class="file-input-wrapper">
            <label for="pImgFile" class="file-input-label" id="fileLabel">
              <i class="fas fa-camera"></i> اختار صورة من الجهاز
            </label>
            <input type="file" id="pImgFile" class="file-input" accept="image/*" onchange="previewAndCompressImage(event)">
          </div>
          <img id="imgPreview" class="image-preview" alt="معاينة الصورة">
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn-save" id="btnSave">حفظ</button>
          <button type="button" onclick="closeModal()" class="btn-cancel">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Custom Delete Confirmation Modal -->
  <div class="modal" id="deleteModal">
    <div class="modal-content" style="text-align: center;">
      <i class="fas fa-exclamation-triangle" style="font-size: 2.5rem; color: var(--danger); margin-bottom: 1rem;"></i>
      <div class="modal-header" style="text-align: center; margin-bottom: 0.5rem;">تأكيد الحذف</div>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">هل أنت تأكد من رغبتك في حذف هذه القطعة؟</p>
      <div class="modal-actions">
        <button type="button" class="btn-danger" id="confirmDeleteBtn">حذف</button>
        <button type="button" class="btn-cancel" onclick="closeDeleteModal()">إلغاء</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzUYILgqSOYKBgFXmwIGlXQylmAfFkIp09oJknX1yRJivGM1fUtwa4e4FHy_DBic48ffA/exec";
    let allItems = [];
    let currentFilter = 'الكل';
    let base64Image = "";
    let itemToDeleteId = null;

    async function fetchData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        allItems = Array.isArray(data) ? data : [];
        renderData();
      } catch (e) {
        console.error("Error fetching data:", e);
      }
    }

    function renderData() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      
      const filtered = allItems.filter(item => {
        const matchesFilter = currentFilter === 'الكل' || item.status === currentFilter;
        const matchesSearch = (item.desc || '').toLowerCase().includes(search) || (item.type || '').toLowerCase().includes(search);
        return matchesFilter && matchesSearch;
      });

      document.getElementById("totalCount").innerText = allItems.length;
      const availableItems = allItems.filter(i => i.status === "متوفر");
      document.getElementById("availableCount").innerText = availableItems.length;
      const totalVal = availableItems.reduce((acc, i) => acc + Number(i.price || 0), 0);
      document.getElementById("totalValue").innerText = totalVal;

      const container = document.getElementById("productsGrid");
      container.innerHTML = "";

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 3rem 1rem; color: var(--text-muted);">
            <i class="fas fa-tag" style="font-size: 3rem; color: #cbd5e1; margin-bottom: 1rem;"></i>
            <div>لا توجد قطع حالياً.</div>
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const div = document.createElement("div");
        div.className = "product-card";
        div.innerHTML = `
          <img src="${item.image || 'https://via.placeholder.com/60'}" class="product-img">
          <div class="product-details">
            <div class="product-title">${item.desc || ''}</div>
            <div class="product-sub">${item.type || ''} - ${item.status || ''}</div>
            <div class="product-price">${item.price || 0} د.ج</div>
          </div>
          <button onclick="promptDelete('${item.id}')" style="background:none; border:none; color:var(--danger); cursor:pointer; padding: 8px;">
            <i class="fas fa-trash"></i>
          </button>
        `;
        container.appendChild(div);
      });
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderData();
    }

    function openModal() { document.getElementById("itemModal").style.display = "flex"; }
    function closeModal() { 
      document.getElementById("itemModal").style.display = "none";
      base64Image = "";
      document.getElementById("pImgFile").value = "";
      document.getElementById("imgPreview").style.display = "none";
      document.getElementById("fileLabel").innerHTML = `<i class="fas fa-camera"></i> اختار صورة من الجهاز`;
      document.getElementById("btnSave").disabled = false;
      document.getElementById("btnSave").innerText = "حفظ";
    }

    function previewAndCompressImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const maxWidth = 250;
            const scaleSize = maxWidth / img.width;
            
            canvas.width = maxWidth;
            canvas.height = img.height * scaleSize;

            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            base64Image = canvas.toDataURL('image/jpeg', 0.6);

            const preview = document.getElementById("imgPreview");
            preview.src = base64Image;
            preview.style.display = "block";
            document.getElementById("fileLabel").innerHTML = `<i class="fas fa-check"></i> تم اختيار الصورة`;
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    async function handleSave(e) {
      e.preventDefault();
      const saveBtn = document.getElementById("btnSave");
      saveBtn.disabled = true;
      saveBtn.innerText = "جاري الحفظ...";

      const newItem = {
        id: Date.now().toString(),
        desc: document.getElementById("pDesc").value,
        type: document.getElementById("pType").value,
        price: document.getElementById("pPrice").value,
        status: document.getElementById("pStatus").value,
        image: base64Image
      };

      allItems.unshift(newItem);
      renderData();
      closeModal();

      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "save", item: newItem })
        });
      } catch (err) {
        console.error("Save error:", err);
      }
    }

    function promptDelete(id) {
      itemToDeleteId = id;
      document.getElementById("deleteModal").style.display = "flex";
    }

    function closeDeleteModal() {
      itemToDeleteId = null;
      document.getElementById("deleteModal").style.display = "none";
    }

    document.getElementById("confirmDeleteBtn").onclick = async function() {
      if (!itemToDeleteId) return;
      const id = itemToDeleteId;
      closeDeleteModal();

      allItems = allItems.filter(i => i.id.toString() !== id.toString());
      renderData();

      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "delete", id: id })
        });
      } catch (err) {
        console.error("Delete error:", err);
      }
    };

    fetchData();
  </script>
</body>
</html>
