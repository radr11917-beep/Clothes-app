<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOUTH STYLE - سجل وتتبع المخزون</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #0d233a;
      --accent: #f5b027;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --danger: #ef4444;
      --success: #10b981;
      --profit: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-dark);
      padding-bottom: 40px;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-circle {
      width: 44px;
      height: 44px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.55rem;
      font-weight: bold;
      color: white;
      line-height: 1;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .brand-text p {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .btn-add {
      background: var(--accent);
      color: var(--primary);
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 1rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 1.2rem;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 10px 4px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }

    .stat-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 4px auto;
      font-size: 0.8rem;
    }

    .icon-box { background: #e0e7ff; color: #3730a3; }
    .icon-check { background: #dcfce7; color: #166534; }
    .icon-wallet { background: #fef3c7; color: #92400e; }
    .icon-profit { background: #dbeafe; color: #1e40af; }

    .stat-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-bottom: 2px;
      font-weight: 600;
    }

    .stat-value {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--primary);
    }

    .search-box {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.9rem;
      background: white;
      margin-bottom: 12px;
      outline: none;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 1.5rem;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: white;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .products-grid {
      display: grid;
      gap: 12px;
    }

    .product-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .product-img {
      width: 70px;
      height: 70px;
      border-radius: 8px;
      object-fit: cover;
      background: #f1f5f9;
      flex-shrink: 0;
    }

    .product-details { flex: 1; text-align: right; }
    .product-title { font-weight: bold; font-size: 0.95rem; }
    .product-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    
    .size-badge {
      display: inline-block;
      background: #e2e8f0;
      color: var(--primary);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.75rem;
    }

    .price-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
      font-size: 0.8rem;
    }

    .buy-tag { color: #64748b; }
    .sell-tag { color: var(--success); font-weight: bold; }
    .profit-tag { color: var(--profit); font-weight: bold; background: #eff6ff; padding: 1px 5px; border-radius: 4px; }
    
    .badge-out {
      color: var(--danger);
      font-weight: bold;
      background: #fee2e2;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    .action-btns {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-direction: column;
    }

    .action-row {
      display: flex;
      gap: 5px;
    }

    .btn-action {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      border: 1px solid;
    }

    .btn-sell {
      background: #d1fae5;
      color: #065f46;
      border-color: #a7f3d0;
    }

    .btn-add-qty {
      background: #e0f2fe;
      color: #0369a1;
      border-color: #bae6fd;
    }

    .btn-edit {
      background: #fef3c7;
      color: #92400e;
      border-color: #fde68a;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px 10px;
    }

    .modal-content {
      background: white;
      padding: 1.5rem;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 1.2rem;
      text-align: right;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 0.9rem;
      text-align: right;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      background-color: #f8fafc;
      outline: none;
    }

    .file-input-wrapper {
      position: relative;
      width: 100%;
    }

    .file-input-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      background-color: #f8fafc;
      border: 2px dashed var(--border);
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .file-input { display: none; }

    .image-preview {
      margin-top: 8px;
      max-height: 90px;
      border-radius: 6px;
      display: none;
      object-fit: cover;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 1.2rem;
    }

    .btn-save {
      flex: 1;
      background: var(--accent);
      color: var(--primary);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-danger {
      flex: 1;
      background: var(--danger);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-cancel {
      flex: 1;
      background: #ffffff;
      color: var(--text-dark);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-info">
      <div class="logo-circle">
        <span>YOUTH</span>
        <span>STYLE</span>
      </div>
      <div class="brand-text">
        <h1>YOUTH STYLE</h1>
        <p>سجل وتتبع المخزون</p>
      </div>
    </div>
    <button class="btn-add" onclick="openAddModal()">
      <i class="fas fa-plus"></i> إضافة قطعة
    </button>
  </header>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon icon-box"><i class="fas fa-box"></i></div>
        <div class="stat-label">القطع الكلية</div>
        <div class="stat-value" id="totalCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon icon-check"><i class="fas fa-check-circle"></i></div>
        <div class="stat-label">المتوفر</div>
        <div class="stat-value" id="availableCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon icon-wallet"><i class="fas fa-wallet"></i></div>
        <div class="stat-label">قيمة المخزون</div>
        <div class="stat-value" id="totalValue">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon icon-profit"><i class="fas fa-chart-line"></i></div>
        <div class="stat-label">الربح المتوقع</div>
        <div class="stat-value" id="totalProfit">0</div>
      </div>
    </div>

    <input type="text" class="search-box" id="searchInput" placeholder="ابحث عن نوع، وصف، أو مقاس..." oninput="renderData()">

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('الكل', this)">الكل</button>
      <button class="filter-btn" onclick="setFilter('متوفر', this)">متوفر</button>
      <button class="filter-btn" onclick="setFilter('منتهي', this)">منتهي (Out of stock)</button>
    </div>

    <div id="productsGrid" class="products-grid"></div>
  </div>

  <!-- Item Modal (Add & Edit) -->
  <div class="modal" id="itemModal">
    <div class="modal-content">
      <div class="modal-header" id="modalTitle">إضافة قطعة جديدة</div>
      <form onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="pId">
        
        <div class="form-group">
          <label>الوصف / اسم القطعة</label>
          <input type="text" id="pDesc" class="form-control" placeholder="مثال: تيشرت أسود" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>النوع</label>
            <input type="text" id="pType" class="form-control" placeholder="قميص، سروال..." required>
          </div>
          <div class="form-group">
            <label>المقاس (Size)</label>
            <input type="text" id="pSize" class="form-control" placeholder="M, L, 42..." required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>سعر الشراء (د.ج)</label>
            <input type="number" id="pBuyPrice" class="form-control" placeholder="0" required>
          </div>
          <div class="form-group">
            <label>سعر البيع (د.ج)</label>
            <input type="number" id="pSellPrice" class="form-control" placeholder="0" required>
          </div>
        </div>

        <div class="form-group">
          <label>الكمية</label>
          <input type="number" id="pQty" class="form-control" value="1" min="0" required>
        </div>

        <div class="form-group">
          <label>صورة القطعة</label>
          <div class="file-input-wrapper">
            <label for="pImgFile" class="file-input-label" id="fileLabel">
              <i class="fas fa-camera"></i> اختار صورة من الجهاز
            </label>
            <input type="file" id="pImgFile" class="file-input" accept="image/*" onchange="previewAndCompressImage(event)">
          </div>
          <img id="imgPreview" class="image-preview" alt="معاينة الصورة">
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn-save" id="btnSave">حفظ</button>
          <button type="button" onclick="closeModal()" class="btn-cancel">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Modal -->
  <div class="modal" id="deleteModal">
    <div class="modal-content" style="text-align: center;">
      <i class="fas fa-exclamation-triangle" style="font-size: 2.5rem; color: var(--danger); margin-bottom: 1rem;"></i>
      <div class="modal-header" style="text-align: center; margin-bottom: 0.5rem;">تأكيد الحذف</div>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">هل أنت متأكد من رغبتك في حذف هذه القطعة نهائياً؟</p>
      <div class="modal-actions">
        <button type="button" class="btn-danger" id="confirmDeleteBtn">حذف</button>
        <button type="button" class="btn-cancel" onclick="closeDeleteModal()">إلغاء</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwRH7xv-DTSpBlx14J-6_Cvt6oXCRFla-QN0DTiPh2ZMTAvyfCcpWCp0j7h2U8xQ8aVCg/exec";
    
    let allItems = [];
    let currentFilter = 'الكل';
    let base64Image = "";
    let itemToDeleteId = null;

    async function fetchData() {
      try {
        const res = await fetch(API_URL + "?t=" + new Date().getTime());
        const data = await res.json();
        allItems = Array.isArray(data) ? data.filter(item => 
          item && 
          item.desc && 
          item.desc.toString().trim() !== "" && 
          item.id
        ) : [];
        renderData();
      } catch (e) {
        console.error("Error fetching data:", e);
      }
    }

    function renderData() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      
      const filtered = allItems.filter(item => {
        const isOutOfStock = Number(item.qty || 0) <= 0 || item.status === 'منتهي';
        const itemStatus = isOutOfStock ? 'منتهي' : 'متوفر';
        
        const matchesFilter = currentFilter === 'الكل' || itemStatus === currentFilter;
        const matchesSearch = (item.desc || '').toLowerCase().includes(search) || 
                              (item.type || '').toLowerCase().includes(search) ||
                              (item.size || '').toLowerCase().includes(search);
        return matchesFilter && matchesSearch;
      });

      const totalPieces = allItems.reduce((acc, i) => acc + Number(i.qty || 0), 0);
      document.getElementById("totalCount").innerText = totalPieces;
      
      const availableItems = allItems.filter(i => Number(i.qty || 0) > 0);
      const availablePieces = availableItems.reduce((acc, i) => acc + Number(i.qty || 0), 0);
      document.getElementById("availableCount").innerText = availablePieces;

      const totalVal = availableItems.reduce((acc, i) => acc + (Number(i.sellPrice || 0) * Number(i.qty || 0)), 0);
      document.getElementById("totalValue").innerText = totalVal;

      const totalProfitVal = availableItems.reduce((acc, i) => {
        const profitPerPiece = Number(i.sellPrice || 0) - Number(i.buyPrice || 0);
        return acc + (profitPerPiece * Number(i.qty || 0));
      }, 0);
      document.getElementById("totalProfit").innerText = totalProfitVal;

      const container = document.getElementById("productsGrid");
      container.innerHTML = "";

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 3rem 1rem; color: var(--text-muted);">
            <i class="fas fa-tag" style="font-size: 3rem; color: #cbd5e1; margin-bottom: 1rem;"></i>
            <div>لا توجد قطع مطابقة.</div>
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const qty = Number(item.qty || 0);
        const isOutOfStock = qty <= 0;
        const buy = Number(item.buyPrice || 0);
        const sell = Number(item.sellPrice || 0);
        const profit = sell - buy;

        const div = document.createElement("div");
        div.className = "product-card";
        div.innerHTML = `
          <img src="${item.image || 'https://via.placeholder.com/70'}" class="product-img">
          <div class="product-details">
            <div class="product-title">${item.desc || ''}</div>
            <div class="product-sub">
              ${item.type || ''} 
              ${item.size ? `| المقاس: <span class="size-badge">${item.size}</span>` : ''} 
              | ${isOutOfStock ? '<span class="badge-out">منتهي (Out of stock)</span>' : `الكمية: <strong style="color:var(--text-dark); font-size:0.95rem;">${qty}</strong>`}
            </div>
            <div class="price-row">
              <span class="buy-tag">شراء: ${buy} د.ج</span>
              <span class="sell-tag">بيع: ${sell} د.ج</span>
              <span class="profit-tag">الربح: ${profit} د.ج</span>
            </div>
          </div>
          <div class="action-btns">
            <div class="action-row">
              <button onclick="addPiece('${item.id}')" class="btn-action btn-add-qty" title="تزويد المخزون (+)">
                <i class="fas fa-plus"></i>
              </button>
              ${!isOutOfStock ? `
                <button onclick="sellPiece('${item.id}')" class="btn-action btn-sell" title="بيع قطعة (-)">
                  <i class="fas fa-minus"></i>
                </button>
              ` : ''}
              <button onclick="openEditModal('${item.id}')" class="btn-action btn-edit" title="تعديل البيانات">
                <i class="fas fa-edit"></i>
              </button>
            </div>
            <button onclick="promptDelete('${item.id}')" style="background:none; border:none; color:var(--danger); cursor:pointer; padding: 4px; font-size: 0.8rem;">
              <i class="fas fa-trash"></i> حذف
            </button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderData();
    }

    function openAddModal() {
      document.getElementById("modalTitle").innerText = "إضافة قطعة جديدة";
      document.getElementById("pId").value = "";
      document.getElementById("pDesc").value = "";
      document.getElementById("pType").value = "";
      document.getElementById("pSize").value = "";
      document.getElementById("pBuyPrice").value = "";
      document.getElementById("pSellPrice").value = "";
      document.getElementById("pQty").value = "1";
      document.getElementById("pImgFile").value = "";
      base64Image = "";
      document.getElementById("imgPreview").style.display = "none";
      document.getElementById("fileLabel").innerHTML = `<i class="fas fa-camera"></i> اختار صورة من الجهاز`;
      document.getElementById("btnSave").innerText = "حفظ";
      document.getElementById("itemModal").style.display = "flex";
    }

    function openEditModal(id) {
      const item = allItems.find(i => i.id.toString().trim() === id.toString().trim());
      if (!item) return;

      document.getElementById("modalTitle").innerText = "تعديل بيانات القطعة";
      document.getElementById("pId").value = item.id;
      document.getElementById("pDesc").value = item.desc || "";
      document.getElementById("pType").value = item.type || "";
      document.getElementById("pSize").value = item.size || "";
      document.getElementById("pBuyPrice").value = item.buyPrice !== undefined ? item.buyPrice : "";
      document.getElementById("pSellPrice").value = item.sellPrice !== undefined ? item.sellPrice : (item.price || "");
      document.getElementById("pQty").value = item.qty !== undefined ? item.qty : 1;
      document.getElementById("pImgFile").value = "";
      
      base64Image = item.image || "";
      if (base64Image) {
        document.getElementById("imgPreview").src = base64Image;
        document.getElementById("imgPreview").style.display = "block";
        document.getElementById("fileLabel").innerHTML = `<i class="fas fa-check"></i> تغيير الصورة الحالية`;
      } else {
        document.getElementById("imgPreview").style.display = "none";
        document.getElementById("fileLabel").innerHTML = `<i class="fas fa-camera"></i> اختار صورة من الجهاز`;
      }

      document.getElementById("btnSave").innerText = "حفظ التعديل";
      document.getElementById("itemModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("itemModal").style.display = "none";
    }

    function previewAndCompressImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const maxWidth = 160;
            const scaleSize = maxWidth / img.width;
            
            canvas.width = maxWidth;
            canvas.height = img.height * scaleSize;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            base64Image = canvas.toDataURL('image/jpeg', 0.5);

            const preview = document.getElementById("imgPreview");
            preview.src = base64Image;
            preview.style.display = "block";
            document.getElementById("fileLabel").innerHTML = `<i class="fas fa-check"></i> تم اختيار الصورة بنجاح`;
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function sendDataToGoogle(payload) {
      return fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        redirect: "follow",
        body: JSON.stringify(payload)
      });
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const existingId = document.getElementById("pId").value.trim();
      const qtyVal = Number(document.getElementById("pQty").value);
      const itemId = existingId ? existingId : "item_" + Date.now();

      const itemData = {
        id: itemId,
        desc: document.getElementById("pDesc").value,
        type: document.getElementById("pType").value,
        size: document.getElementById("pSize").value,
        buyPrice: Number(document.getElementById("pBuyPrice").value) || 0,
        sellPrice: Number(document.getElementById("pSellPrice").value) || 0,
        qty: qtyVal,
        status: qtyVal > 0 ? "متوفر" : "منتهي",
        image: base64Image
      };

      if (existingId) {
        const index = allItems.findIndex(i => i.id.toString().trim() === existingId);
        if (index > -1) allItems[index] = itemData;
      } else {
        allItems.unshift(itemData);
      }

      renderData();
      closeModal();

      try {
        await sendDataToGoogle({ action: "save", item: itemData });
      } catch (err) {
        console.error("Save error:", err);
      }
    }

    async function addPiece(id) {
      const item = allItems.find(i => i.id.toString().trim() === id.toString().trim());
      if (item) {
        item.qty = Number(item.qty || 0) + 1;
        item.status = "متوفر";
        renderData();

        try {
          await sendDataToGoogle({ action: "save", item: item });
        } catch (err) {
          console.error("Update error:", err);
        }
      }
    }

    async function sellPiece(id) {
      const item = allItems.find(i => i.id.toString().trim() === id.toString().trim());
      if (item) {
        let currentQty = Number(item.qty || 1);
        if (currentQty > 0) {
          currentQty -= 1;
          item.qty = currentQty;
          if (currentQty === 0) item.status = "منتهي";
          renderData();

          try {
            await sendDataToGoogle({ action: "save", item: item });
          } catch (err) {
            console.error("Update error:", err);
          }
        }
      }
    }

    function promptDelete(id) {
      itemToDeleteId = id.toString().trim();
      document.getElementById("deleteModal").style.display = "flex";
    }

    function closeDeleteModal() {
      itemToDeleteId = null;
      document.getElementById("deleteModal").style.display = "none";
    }

    document.getElementById("confirmDeleteBtn").onclick = async function() {
      if (!itemToDeleteId) return;
      const id = itemToDeleteId;
      closeDeleteModal();

      allItems = allItems.filter(i => i.id.toString().trim() !== id);
      renderData();

      try {
        await sendDataToGoogle({ action: "delete", id: id });
      } catch (err) {
        console.error("Delete error:", err);
      }
    };

    fetchData();
  </script>
</body>
</html>
