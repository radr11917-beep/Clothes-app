<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOUTH STYLE - إدارة المخزون</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #0d233a; --accent: #f5b027; --bg: #f4f6f9; --card-bg: #ffffff;
      --text-dark: #1e293b; --text-muted: #64748b; --border: #cbd5e1;
      --danger: #ef4444; --success: #10b981; --profit: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text-dark); padding-bottom: 40px; }

    /* شاشة القفل */
    #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .lock-card { background: white; padding: 2rem; border-radius: 20px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
    .pin-input { width: 100%; padding: 12px; font-size: 1.5rem; text-align: center; border: 2px solid var(--border); border-radius: 10px; margin: 15px 0; outline: none; }
    .btn-unlock { width: 100%; background: var(--accent); color: var(--primary); border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    
    /* الواجهة الرئيسية */
    #mainApp { display: none; }
    header { background: var(--primary); color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 600px; margin: 0 auto; padding: 1rem; }
    
    /* الإحصائيات */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1.2rem; }
    .stat-card { background: var(--card-bg); border-radius: 10px; padding: 10px; text-align: center; border: 1px solid #e2e8f0; }
    .stat-value { font-size: 0.95rem; font-weight: bold; color: var(--primary); }
    
    .products-grid { display: grid; gap: 12px; }
    .product-card { background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; display: flex; gap: 12px; align-items: center; }
    .product-img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; background: #f1f5f9; }
    .product-details { flex: 1; text-align: right; }
    .product-price { font-weight: bold; color: var(--success); margin-top: 5px; }
    .action-row { display: flex; gap: 5px; margin-top: 5px; }
    .btn-action { padding: 6px 12px; border-radius: 6px; cursor: pointer; border: none; font-weight: bold; }
    .btn-sell { background: #d1fae5; color: #065f46; }
    .btn-add { background: #e0f2fe; color: #0369a1; }
    .badge-out { color: var(--danger); font-weight: bold; font-size: 0.8rem; margin-right: 5px; }
    
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: white; padding: 1.5rem; border-radius: 16px; width: 100%; max-width: 400px; }
    .form-control { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ddd; border-radius: 8px; }
  </style>
</head>
<body>

  <div id="lockScreen">
    <div class="lock-card">
      <h2 style="margin-bottom:15px;">تسجيل الدخول</h2>
      <form onsubmit="handleUnlock(event)">
        <input type="password" id="pinInput" class="pin-input" placeholder="الرمز السري" required autofocus>
        <div id="lockError" style="color:red; font-size:0.8rem; margin-bottom:10px;"></div>
        <button type="submit" class="btn-unlock">دخول</button>
      </form>
    </div>
  </div>

  <div id="mainApp">
    <header>
      <div><h1 style="font-size:1.2rem;">YOUTH STYLE</h1><p id="roleTitle" style="font-size:0.7rem;"></p></div>
      <button class="btn-add" id="btnAddMain" onclick="openAddModal()"><i class="fas fa-plus"></i></button>
    </header>

    <div class="container">
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="stat-label">إجمالي القطع</div><div class="stat-value" id="totalCount">0</div></div>
        <div class="stat-card"><div class="stat-label">متوفرة</div><div class="stat-value" id="availableCount">0</div></div>
        <div class="stat-card"><div class="stat-label">القيمة (د.ج)</div><div class="stat-value" id="totalValue">0</div></div>
      </div>

      <div id="productsGrid" class="products-grid"></div>
    </div>
  </div>

  <div class="modal" id="itemModal">
    <div class="modal-content">
      <div id="modalTitle" style="font-weight:bold; margin-bottom:15px;">إضافة قطعة</div>
      <input type="hidden" id="pId"><input type="text" id="pDesc" class="form-control" placeholder="الوصف">
      <div style="display:flex; gap:10px;"><input type="text" id="pType" class="form-control" placeholder="النوع"><input type="text" id="pSize" class="form-control" placeholder="المقاس"></div>
      <div style="display:flex; gap:10px;"><input type="number" id="pBuyPrice" class="form-control" placeholder="شراء"><input type="number" id="pSellPrice" class="form-control" placeholder="بيع"></div>
      <input type="number" id="pQty" class="form-control" placeholder="الكمية">
      <button class="btn-unlock" onclick="handleFormSubmit()">حفظ</button>
      <button class="btn-action" style="width:100%; margin-top:10px;" onclick="closeModal()">إلغاء</button>
    </div>
  </div>

  <script>
    const ADMIN_PIN = "2007";
    const VIEWER_PIN = "2006";
    const API_URL = "https://script.google.com/macros/s/AKfycbyfoFjOIRbHB_vY9pA6ioL6w_2H5F-x05jTX427f3cF5_m8duck5_NEXRWDOfm3T5-mwg/exec";
    let userRole = "none", allItems = [];

    function handleUnlock(e) {
      e.preventDefault();
      const p = document.getElementById("pinInput").value.trim();
      if (p === ADMIN_PIN) { userRole = "admin"; initApp(); }
      else if (p === VIEWER_PIN) { userRole = "viewer"; initApp(); }
      else document.getElementById("lockError").innerText = "رمز خطأ";
    }

    function initApp() {
      document.getElementById("lockScreen").style.display = "none";
      document.getElementById("mainApp").style.display = "block";
      document.getElementById("roleTitle").innerText = userRole === "admin" ? "لوحة المدير" : "لوحة المبيعات";
      document.getElementById("btnAddMain").style.display = userRole === "admin" ? "block" : "none";
      document.getElementById("statsGrid").style.display = userRole === "admin" ? "grid" : "none";
      fetchData();
    }

    async function fetchData() {
      const res = await fetch(API_URL + "?t=" + new Date().getTime());
      allItems = await res.json();
      renderData();
    }

    function renderData() {
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = "";
      allItems.forEach(item => {
        const qty = Number(item.qty || 0);
        const div = document.createElement("div");
        div.className = "product-card";
        div.innerHTML = `
          <img src="${item.image || 'https://via.placeholder.com/70'}" class="product-img">
          <div class="product-details">
            <div style="font-weight:bold;">${item.desc}</div>
            <div style="font-size:0.8rem; color:gray;">${item.type} | مقاس: ${item.size}</div>
            <div style="font-size:0.8rem;">الكمية: <strong>${qty}</strong> ${qty <= 0 ? '<span class="badge-out">Out of stock</span>' : ''}</div>
            <div class="product-price">${item.sellPrice} د.ج</div>
          </div>
          <div class="action-btns" style="display:flex; flex-direction:column; gap:5px;">
            <button class="btn-action btn-sell" onclick="updateQty('${item.id}', -1)" ${qty <= 0 ? 'disabled style="opacity:0.3"' : ''}>بيع (-)</button>
            ${userRole === 'admin' ? `<button class="btn-action btn-add" onclick="updateQty('${item.id}', 1)">زيادة (+)</button>` : ''}
          </div>
        `;
        grid.appendChild(div);
      });
      if(userRole === 'admin') updateStats();
    }

    async function updateQty(id, change) {
      const item = allItems.find(i => i.id == id);
      if(!item) return;
      item.qty = Number(item.qty) + change;
      if(item.qty < 0) item.qty = 0;
      renderData();
      await fetch(API_URL, {method:"POST", body: JSON.stringify({action:"save", item:item})});
    }

    function updateStats() {
      document.getElementById("totalCount").innerText = allItems.reduce((a, b) => a + Number(b.qty), 0);
      document.getElementById("availableCount").innerText = allItems.filter(i => i.qty > 0).length;
      document.getElementById("totalValue").innerText = allItems.reduce((a, b) => a + (Number(b.sellPrice) * Number(b.qty)), 0);
    }

    function lockApp() { location.reload(); }
    function openAddModal() { document.getElementById("itemModal").style.display = "flex"; }
    function closeModal() { document.getElementById("itemModal").style.display = "none"; }
    async function handleFormSubmit() {
        const item = {
            id: Date.now(), desc: document.getElementById("pDesc").value,
            type: document.getElementById("pType").value, size: document.getElementById("pSize").value,
            buyPrice: document.getElementById("pBuyPrice").value, sellPrice: document.getElementById("pSellPrice").value,
            qty: document.getElementById("pQty").value
        };
        await fetch(API_URL, {method:"POST", body: JSON.stringify({action:"save", item:item})});
        location.reload();
    }
  </script>
</body>
</html>
