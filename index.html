<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام إدارة مخزون الملابس</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Tajawal', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [items, setItems] = useState(() => {
        const saved = localStorage.getItem('clothes_items_v2');
        return saved ? JSON.parse(saved) : [];
      });
      const [type, setType] = useState('');
      const [price, setPrice] = useState('');
      const [filter, setFilter] = useState('الكل');

      useEffect(() => {
        localStorage.setItem('clothes_items_v2', JSON.stringify(items));
      }, [items]);

      const addItem = (e) => {
        e.preventDefault();
        if (!type || !price) return;
        setItems([{ id: Date.now(), type, price: Number(price), status: 'متوفر', date: new Date().toLocaleDateString('ar-DZ') }, ...items]);
        setType('');
        setPrice('');
      };

      const toggleStatus = (id) => {
        setItems(items.map(item => item.id === id ? { ...item, status: item.status === 'متوفر' ? 'تم البيع' : 'متوفر' } : item));
      };

      const deleteItem = (id) => {
        setItems(items.filter(item => item.id !== id));
      };

      const filtered = items.filter(item => filter === 'الكل' ? true : item.status === filter);
      const totalSales = items.filter(i => i.status === 'تم البيع').reduce((acc, curr) => acc + curr.price, 0);
      const totalAvailable = items.filter(i => i.status === 'متوفر').length;

      return (
        <div class="max-w-md mx-auto px-4 pt-6 space-y-5">
          <!-- الهيدر والإحصائيات -->
          <div class="bg-slate-800/80 backdrop-blur border border-slate-700/60 rounded-2xl p-5 shadow-xl">
            <div class="flex items-center justify-between border-b border-slate-700/50 pb-4 mb-4">
              <div>
                <h1 class="text-xl font-extrabold text-white">متجري للملابس 👕</h1>
                <p class="text-xs text-slate-400 mt-0.5">إدارة المخزون والمبيعات</p>
              </div>
              <span class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-xs px-2.5 py-1 rounded-full font-bold">
                {items.length} قطعة إجمالاً
              </span>
            </div>

            <div class="grid grid-cols-2 gap-3 text-center">
              <div class="bg-slate-900/60 border border-slate-700/40 p-3 rounded-xl">
                <p class="text-xs text-slate-400 font-medium mb-1">المبيعات الإجمالية</p>
                <p class="text-lg font-black text-emerald-400">{totalSales.toLocaleString()} <span class="text-xs font-normal">د.ج</span></p>
              </div>
              <div class="bg-slate-900/60 border border-slate-700/40 p-3 rounded-xl">
                <p class="text-xs text-slate-400 font-medium mb-1">المتوفر في المخزن</p>
                <p class="text-lg font-black text-blue-400">{totalAvailable} <span class="text-xs font-normal">قطعة</span></p>
              </div>
            </div>
          </div>

          <!-- نموذج الإضافة -->
          <form onSubmit={addItem} class="bg-slate-800/80 backdrop-blur border border-slate-700/60 rounded-2xl p-4 shadow-xl space-y-3">
            <h2 class="text-sm font-bold text-slate-200">إضافة قطعة جديدة</h2>
            <div class="space-y-2">
              <input 
                type="text" 
                value={type} 
                onChange={(e) => setType(e.target.value)} 
                placeholder="اسم القطعة (مثلاً: قميص أبيض L)" 
                class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition" 
                required 
              />
              <input 
                type="number" 
                value={price} 
                onChange={(e) => setPrice(e.target.value)} 
                placeholder="السعر بالدينار (د.ج)" 
                class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition" 
                required 
              />
            </div>
            <button 
              type="submit" 
              class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/30 active:scale-[0.98]"
            >
              + إضافة للمخزون
            </button>
          </form>

          <!-- أدوات الفلترة -->
          <div class="flex bg-slate-800/50 p-1 rounded-xl border border-slate-700/50 gap-1">
            {['الكل', 'متوفر', 'تم البيع'].map(st => (
              <button 
                key={st} 
                onClick={() => setFilter(st)} 
                class={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${filter === st ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                {st}
              </button>
            ))}
          </div>

          <!-- قائمة القطع -->
          <div class="space-y-2.5">
            {filtered.length === 0 && (
              <div class="text-center py-10 bg-slate-800/30 rounded-2xl border border-dashed border-slate-700">
                <p class="text-sm text-slate-500">لا توجد قطع في هذه الفئة حالياً</p>
              </div>
            )}
            
            {filtered.map(item => (
              <div 
                key={item.id} 
                class="bg-slate-800/90 border border-slate-700/60 p-3.5 rounded-xl shadow-md flex items-center justify-between transition hover:border-slate-600"
              >
                <div class="space-y-1">
                  <h3 class="font-bold text-slate-100 text-sm">{item.type}</h3>
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-extrabold text-indigo-400">{item.price.toLocaleString()} د.ج</span>
                    <span class="text-[10px] text-slate-500">• {item.date}</span>
                  </div>
                </div>

                <div class="flex items-center gap-2">
                  <button 
                    onClick={() => toggleStatus(item.id)} 
                    class={`px-3 py-1 rounded-lg text-xs font-bold transition border ${
                      item.status === 'متوفر' 
                        ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/20' 
                        : 'bg-amber-500/10 text-amber-400 border-amber-500/30 hover:bg-amber-500/20'
                    }`}
                  >
                    {item.status}
                  </button>
                  <button 
                    onClick={() => deleteItem(item.id)} 
                    class="p-1 text-slate-500 hover:text-rose-400 transition"
                    title="حذف"
                  >
                    ✕
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
