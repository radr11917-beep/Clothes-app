<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOUTH STYLE - متجر الملابس</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #111111;
      --accent: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 60px;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: #fff;
      text-decoration: none;
    }

    .header-actions {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid white;
      color: white;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .filters {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 2rem;
    }

    .filter-btn {
      padding: 8px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
      font-weight: 500;
      color: var(--text-muted);
    }

    .filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }

    .card-img-container {
      width: 100%;
      height: 280px;
      background: #f1f5f9;
      position: relative;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 1rem;
    }

    .card-type {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .card-title {
      font-size: 1.1rem;
      margin: 5px 0;
      font-weight: 600;
    }

    .card-price {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .sizes-list {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .size-tag {
      font-size: 0.75rem;
      padding: 2px 8px;
      background: #f1f5f9;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .status-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      color: white;
    }

    .status-available { background: var(--success); }
    .status-out { background: var(--danger); }

    .admin-controls {
      display: flex;
      gap: 5px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.8);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="loading" class="loading-overlay">
    <i class="fas fa-spinner fa-spin fa-2x"></i> &nbsp; جاري التحميل...
  </div>

  <header>
    <a href="#" class="logo">YOUTH STYLE</a>
    <div class="header-actions">
      <button class="btn btn-outline" id="adminToggleBtn" onclick="toggleAdminMode()">
        <i class="fas fa-lock"></i> لوحة التحكم
      </button>
      <button class="btn btn-primary" id="addBtn" style="display: none;" onclick="openModal()">
        <i class="fas fa-plus"></i> إضافة منتج
      </button>
    </div>
  </header>

  <div class="container">
    <div class="filters" id="categoryFilters">
      <button class="filter-btn active" onclick="filterCategory('all', this)">الكل</button>
      <button class="filter-btn" onclick="filterCategory('قميص', this)">قمصان</button>
      <button class="filter-btn" onclick="filterCategory('سروال', this)">سراويل</button>
      <button class="filter-btn" onclick="filterCategory('حذاء', this)">أحذية</button>
      <button class="filter-btn" onclick="filterCategory('سترة', this)">سترات</button>
    </div>

    <div class="grid" id="productsGrid"></div>
  </div>

  <!-- Modal -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <h2 id="modalTitle" style="margin-bottom: 1.5rem;">إضافة منتج جديد</h2>
      <form id="productForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="productId">
        
        <div class="form-group">
          <label>نوع القطعة</label>
          <select class="form-control" id="productType" required>
            <option value="قميص">قميص</option>
            <option value="سروال">سروال</option>
            <option value="حذاء">حذاء</option>
            <option value="سترة">سترة</option>
          </select>
        </div>

        <div class="form-group">
          <label>الوصف / اسم المنتج</label>
          <input type="text" class="form-control" id="productDesc" required>
        </div>

        <div class="form-group">
          <label>السعر (د.ج)</label>
          <input type="number" class="form-control" id="productPrice" required>
        </div>

        <div class="form-group">
          <label>الحالة</label>
          <select class="form-control" id="productStatus" required>
            <option value="متوفر">متوفر</option>
            <option value="غير متوفر">غير متوفر</option>
          </select>
        </div>

        <div class="form-group">
          <label>المقاسات المتاحة (افصل بينها بـ مفتاح Enter أو comma)</label>
          <input type="text" class="form-control" id="productSizes" placeholder="مثال: S, M, L, XL">
        </div>

        <div class="form-group">
          <label>رابط الصورة (URL)</label>
          <input type="url" class="form-control" id="productImage" placeholder="https://example.com/image.jpg">
        </div>

        <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary" style="flex: 1;">حفظ</button>
          <button type="button" class="btn btn-outline" style="color: var(--text);" onclick="closeModal()">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzyzl-JUXOmxMeDZxzn00ygPV3pyYAL6qcNGNRBbpetwuqU8Gew2wGnxU-zXCV_xkNMoQ/exec";
    
    let products = [];
    let isAdmin = false;
    let currentCategory = 'all';

    async function fetchProducts() {
      showLoading(true);
      try {
        const response = await fetch(API_URL);
        products = await response.json();
        renderProducts();
      } catch (error) {
        alert("حدث خطأ أثناء جلب البيانات من السيرفر!");
        console.error(error);
      } finally {
        showLoading(false);
      }
    }

    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = "";

      const filtered = currentCategory === 'all' 
        ? products 
        : products.filter(p => p.type === currentCategory);

      filtered.forEach(p => {
        const isAvailable = p.status === "متوفر";
        const sizesArr = Array.isArray(p.sizes) ? p.sizes : [];

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-img-container">
            <span class="status-badge ${isAvailable ? 'status-available' : 'status-out'}">${p.status}</span>
            <img src="${p.image || 'https://via.placeholder.com/300x300?text=No+Image'}" class="card-img" alt="${p.desc}">
          </div>
          <div class="card-body">
            <div class="card-type">${p.type}</div>
            <div class="card-title">${p.desc}</div>
            <div class="card-price">${p.price} د.ج</div>
            <div class="sizes-list">
              ${sizesArr.map(s => `<span class="size-tag">${s}</span>`).join('')}
            </div>
            ${isAdmin ? `
              <div class="admin-controls">
                <button class="btn btn-outline" style="color: var(--text); padding: 4px 8px; font-size: 0.8rem;" onclick="editProduct('${p.id}')"><i class="fas fa-edit"></i> تعديل</button>
                <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.8rem;" onclick="deleteProduct('${p.id}')"><i class="fas fa-trash"></i> حذف</button>
              </div>
            ` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    function toggleAdminMode() {
      if (!isAdmin) {
        const pass = prompt("أدخل كلمة المرور للوحة التحكم:");
        if (pass === "1234") { // يمكنك تغيير كلمة المرور هنا
          isAdmin = true;
          document.getElementById("addBtn").style.display = "inline-flex";
          document.getElementById("adminToggleBtn").innerHTML = `<i class="fas fa-unlock"></i> الخروج من التحكم`;
        } else if (pass !== null) {
          alert("كلمة المرور خاطئة!");
        }
      } else {
        isAdmin = false;
        document.getElementById("addBtn").style.display = "none";
        document.getElementById("adminToggleBtn").innerHTML = `<i class="fas fa-lock"></i> لوحة التحكم`;
      }
      renderProducts();
    }

    function openModal(item = null) {
      const modal = document.getElementById("productModal");
      const title = document.getElementById("modalTitle");

      if (item) {
        title.innerText = "تعديل المنتج";
        document.getElementById("productId").value = item.id;
        document.getElementById("productType").value = item.type;
        document.getElementById("productDesc").value = item.desc;
        document.getElementById("productPrice").value = item.price;
        document.getElementById("productStatus").value = item.status;
        document.getElementById("productSizes").value = (item.sizes || []).join(', ');
        document.getElementById("productImage").value = item.image || '';
      } else {
        title.innerText = "إضافة منتج جديد";
        document.getElementById("productForm").reset();
        document.getElementById("productId").value = "";
      }
      modal.style.display = "flex";
    }

    function closeModal() {
      document.getElementById("productModal").style.display = "none";
    }

    function editProduct(id) {
      const item = products.find(p => String(p.id) === String(id));
      if (item) openModal(item);
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      closeModal();
      showLoading(true);

      const id = document.getElementById("productId").value || Date.now().toString();
      const type = document.getElementById("productType").value;
      const desc = document.getElementById("productDesc").value;
      const price = document.getElementById("productPrice").value;
      const status = document.getElementById("productStatus").value;
      const sizesRaw = document.getElementById("productSizes").value;
      const image = document.getElementById("productImage").value;

      const sizes = sizesRaw.split(',').map(s => s.trim()).filter(s => s.length > 0);

      const payload = {
        action: "save",
        item: { id, type, desc, price, status, sizes, image }
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        await fetchProducts();
      } catch (err) {
        alert("فشل التحديث!");
        console.error(err);
        showLoading(false);
      }
    }

    async function deleteProduct(id) {
      if (!confirm("هل أنت تأكد من نقل أو حذف هذا المنتج؟")) return;

      showLoading(true);
      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "delete", id })
        });
        await fetchProducts();
      } catch (err) {
        alert("فشل الحذف!");
        console.error(err);
        showLoading(false);
      }
    }

    function showLoading(show) {
      document.getElementById("loading").style.display = show ? "flex" : "none";
    }

    // التشغيل التلقائي عند فتح الصفحة
    fetchProducts();
  </script>
</body>
</html>
