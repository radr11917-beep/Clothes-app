<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>متجري للملابس</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [items, setItems] = useState(() => {
        const saved = localStorage.getItem('clothes_app_items');
        return saved ? JSON.parse(saved) : [];
      });
      const [type, setType] = useState('');
      const [price, setPrice] = useState('');
      const [filter, setFilter] = useState('الكل');

      useEffect(() => {
        localStorage.setItem('clothes_app_items', JSON.stringify(items));
      }, [items]);

      const addItem = (e) => {
        e.preventDefault();
        if (!type || !price) return;
        setItems([{ id: Date.now(), type, price: Number(price), status: 'متوفر' }, ...items]);
        setType('');
        setPrice('');
      };

      const toggleStatus = (id) => {
        setItems(items.map(item => item.id === id ? { ...item, status: item.status === 'متوفر' ? 'تم البيع' : 'متوفر' } : item));
      };

      const deleteItem = (id) => {
        setItems(items.filter(item => item.id !== id));
      };

      const filtered = items.filter(item => filter === 'الكل' ? true : item.status === filter);
      const totalSales = items.filter(i => i.status === 'تم البيع').reduce((acc, curr) => acc + curr.price, 0);

      return (
        <div class="max-w-md mx-auto space-y-4">
          <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center">
            <h1 class="text-xl font-bold text-white">إدارة مخزون الملابس</h1>
            <p class="text-sm text-green-400 font-semibold mt-1">المبيعات: {totalSales} د.ج</p>
          </div>

          <form onSubmit={addItem} class="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-3">
            <input 
              type="text" 
              value={type} 
              onChange={(e) => setType(e.target.value)} 
              placeholder="نوع القطعة" 
              class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-sm text-white" 
              required 
            />
            <input 
              type="number" 
              value={price} 
              onChange={(e) => setPrice(e.target.value)} 
              placeholder="السعر (د.ج)" 
              class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-sm text-white" 
              required 
            />
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-2.5 rounded-lg text-sm text-white">
              إضافة قطعة
            </button>
          </form>

          <div class="flex gap-2">
            {['الكل', 'متوفر', 'تم البيع'].map(st => (
              <button 
                key={st} 
                onClick={() => setFilter(st)} 
                class={`flex-1 py-2 text-xs font-bold rounded-lg border ${filter === st ? 'bg-blue-600 border-blue-500 text-white' : 'bg-gray-800 border-gray-700 text-gray-400'}`}
              >
                {st}
              </button>
            ))}
          </div>

          <div class="space-y-2">
            {filtered.map(item => (
              <div key={item.id} class="bg-gray-800 p-3 rounded-xl border border-gray-700 flex justify-between items-center">
                <div>
                  <div class="font-bold text-sm text-white">{item.type}</div>
                  <div class="text-xs text-gray-400">{item.price} د.ج</div>
                </div>
                <div class="flex items-center gap-2">
                  <button 
                    onClick={() => toggleStatus(item.id)} 
                    class={`px-3 py-1 rounded-lg text-xs font-bold ${item.status === 'متوفر' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-gray-700 text-gray-300'}`}
                  >
                    {item.status}
                  </button>
                  <button onClick={() => deleteItem(item.id)} class="text-red-400 text-xs px-1">حذف</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
